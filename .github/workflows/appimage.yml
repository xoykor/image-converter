name: AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build-appimage.sh"
      - "pyproject.toml"
      - ".github/workflows/appimage.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build-appimage.sh"
      - "pyproject.toml"
      - ".github/workflows/appimage.yml"

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg file libgl1 libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Install modern static FFmpeg
        run: |
          curl -L --fail --retry 3             https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz             -o /tmp/ffmpeg-static.tar.xz

          mkdir -p "$GITHUB_WORKSPACE/build/ffmpeg-static"
          tar -xJf /tmp/ffmpeg-static.tar.xz             --strip-components=1             -C "$GITHUB_WORKSPACE/build/ffmpeg-static"

          echo "$GITHUB_WORKSPACE/build/ffmpeg-static/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/build/ffmpeg-static/bin/ffmpeg" -hide_banner -encoders | grep libaom-av1
          "$GITHUB_WORKSPACE/build/ffmpeg-static/bin/ffmpeg" -hide_banner -muxers | grep -w avif

      - name: Build AppImage
        env:
          ARCH: x86_64
          OUTPUT_FILE: dist-appimage/ImageConverter-${{ github.sha }}-x86_64.AppImage
        run: bash scripts/build-appimage.sh

      - name: Smoke-check AppImage
        run: |
          APPIMAGE="$(find dist-appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -x "$APPIMAGE"
          file "$APPIMAGE"
          "$APPIMAGE" --appimage-version

          # The GUI must remain alive when launched. The previous packaging bug
          # exited successfully and immediately because main() was never called.
          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 5s "$APPIMAGE"
          status=$?
          set -e

          if [ "$status" -ne 124 ]; then
            echo "AppImage exited unexpectedly with status $status" >&2
            exit 1
          fi

      - name: Smoke-check bundled AVIF encoder
        run: |
          APPIMAGE="$(find dist-appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          rm -rf squashfs-root avif-smoke
          "$APPIMAGE" --appimage-extract >/dev/null
          mkdir -p avif-smoke

          python - <<'PY'
          from pathlib import Path
          w, h = 64, 64
          data = bytearray()
          for y in range(h):
              for x in range(w):
                  data.extend((x * 4 % 256, y * 4 % 256, (x + y) * 2 % 256))
          Path("avif-smoke/input.ppm").write_bytes(
              f"P6\n{w} {h}\n255\n".encode() + data
          )
          PY

          squashfs-root/usr/bin/ffmpeg             -y             -loglevel error             -i avif-smoke/input.ppm             -map_metadata -1             -frames:v 1             -c:v libaom-av1             -cpu-used 6             -row-mt 1             -pix_fmt yuv420p             -crf 40             -b:v 0             avif-smoke/output.avif

          test -s avif-smoke/output.avif
          squashfs-root/usr/bin/ffprobe             -v error             -select_streams v:0             -show_entries stream=codec_name,width,height             -of default=nw=1             avif-smoke/output.avif

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverter-AppImage-x86_64
          path: dist-appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
