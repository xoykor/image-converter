[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-converter"
version = "0.1.0"
description = "Desktop batch image converter with target-size AVIF encoding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "xoykor" }]
dependencies = [
  "PySide6>=6.7,<7",
]

[project.scripts]
image-converter = "image_converter.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
